name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch fonts (Outfit, JetBrains Mono) from Google Fonts
        run: |
          set -e
          mkdir -p app/src/main/res/font
          get() {
            css=$(curl -fsSL -A "Wget/1.21" "https://fonts.googleapis.com/css2?family=$1:wght@$2")
            url=$(printf '%s' "$css" | grep -o 'https://[^)]*' | head -1)
            echo "$1 $2 -> $url"
            curl -fsSL "$url" -o "app/src/main/res/font/$3.ttf"
            head -c 4 "app/src/main/res/font/$3.ttf" | od -An -tx1
          }
          get Outfit 200 outfit_extralight
          get Outfit 300 outfit_light
          get Outfit 400 outfit_regular
          get Outfit 500 outfit_medium
          get Outfit 600 outfit_semibold
          get JetBrains+Mono 400 jbmono_regular
          get JetBrains+Mono 500 jbmono_medium
          ls -la app/src/main/res/font
      - name: Build
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Stoa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stoa-apk
          path: Stoa.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Stoa.apk --title "Stoa build ${{ github.run_number }}" --notes "Open this page on your phone and tap Stoa.apk to install or update." --latest
